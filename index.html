<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <meta name="description" content="Kalorien und Nährwerte per Barcode erfassen" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Tracker</title>
  </head>
  <body>
    <script>
      // Zeigt Startfehler direkt auf dem Bildschirm, weil Safari auf dem iPhone ohne Mac keine Konsole hat.
      ;(function () {
        function show(msg) {
          var el = document.getElementById('boot-error')
          if (!el) {
            el = document.createElement('pre')
            el.id = 'boot-error'
            el.style.cssText =
              'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;margin:0;padding:12px;border-radius:12px;background:#fff3f0;color:#7a2414;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word'
            document.body.appendChild(el)
          }
          el.textContent += msg + '\n'
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && t !== window && (t.src || t.href)) show('Datei nicht geladen: ' + (t.src || t.href))
            else show('Fehler: ' + e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''))
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          show('Fehler: ' + ((e.reason && e.reason.message) || e.reason))
        })
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.children.length) show('Die App ist nicht gestartet.\n' + navigator.userAgent)
        }, 8000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
